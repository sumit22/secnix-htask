name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Commits & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: actions/setup-node@v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 26
          cache: npm
      - name: Commitlint (PR commits)
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  web:
    name: Web (lint, types, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    name: API (pint, larastan, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, pcntl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      - run: composer analyse
      - run: composer deptrac
      - run: composer test
      - name: Shared contracts are up to date
        run: |
          php artisan contracts:export > ../web/src/contracts/generated.ts
          git diff --exit-code -- ../web/src/contracts/generated.ts \
            || { echo "::error::Run 'npm run contracts:export' and commit apps/web/src/contracts/generated.ts"; exit 1; }

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate compose
        run: DB_PASSWORD=ci APP_KEY=ci docker compose -f docker-compose.yml config --quiet
      - uses: docker/build-push-action@v7.4.0
        with:
          context: apps/api
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v7.4.0
        with:
          context: apps/web
          target: prod
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
